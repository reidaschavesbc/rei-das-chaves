server {
    listen 80;
    server_name chaveiroreidaschaves.com www.chaveiroreidaschaves.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/reidaschaves-site/acme; }
    location / { return 308 https://chaveiroreidaschaves.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name chaveiroreidaschaves.com www.chaveiroreidaschaves.com;
    ssl_certificate /etc/reidaschaves-site/letsencrypt/live/chaveiroreidaschaves.com/fullchain.pem;
    ssl_certificate_key /etc/reidaschaves-site/letsencrypt/live/chaveiroreidaschaves.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ReiDasChavesTLS:1m;
    if ($host = www.chaveiroreidaschaves.com) { return 308 https://chaveiroreidaschaves.com$request_uri; }
    location = /previa-servicos.png {
        alias /opt/reidaschaves-site/previews/servicos-prata-dourado-v2.png;
        default_type image/png;
        include /etc/nginx/snippets/reidaschaves-site-security.conf;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Robots-Tag "noindex" always;

    }
    location ^~ /previa-assets/ {
        alias /opt/reidaschaves-site/previews/assets/;
        autoindex off;
        default_type image/webp;
        include /etc/nginx/snippets/reidaschaves-site-security.conf;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Robots-Tag "noindex" always;

    }
    location = /previa-visual {
        alias /opt/reidaschaves-site/previews/fundo-menu.html;
        default_type text/html;
        include /etc/nginx/snippets/reidaschaves-site-security.conf;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

    }
    location = /previa-visual/ { return 308 /previa-visual; }
    root /var/lib/reidaschaves-site/current;
    index index.html;
    access_log off;
    error_log /var/log/nginx/reidaschaves-site-error.log warn;
    client_max_body_size 20k;
    server_tokens off;
    include /etc/nginx/snippets/reidaschaves-site-security.conf;


    location = /admin { return 308 /admin/; }
    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
    location ~ (^|/)\. { return 404; }
    location ~* ^/(admin-service|private|releases|node_modules|package|release\.json|CNAME|serve\.json) { return 404; }
    location = / { try_files /index.html =404; include /etc/nginx/snippets/reidaschaves-site-security.conf; add_header Cache-Control "no-cache"; }
    location / {
        limit_except GET HEAD { deny all; }
        limit_rate 2m;
        try_files $uri $uri.html =404;
        include /etc/nginx/snippets/reidaschaves-site-security.conf; add_header Cache-Control "no-cache";
    }
}
