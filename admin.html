<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin | Rei das Chaves</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/png" sizes="32x32" href="image/favicon-32x32.png">
  <link rel="shortcut icon" href="image/favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/novo.css?v=2">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

  <!-- ══════════════════════════════
       TELA DE LOGIN
  ══════════════════════════════ -->
  <section id="loginScreen" class="login-screen">
    <form id="loginForm" class="login-card">
      <img src="image/logo.png" alt="Rei das Chaves" class="login-logo">
      <h1>Painel Admin</h1>
      <p class="login-sub">Entre para gerenciar os produtos do site</p>

      <label class="field">
        <span>E-mail</span>
        <input type="email" id="loginEmail" required autocomplete="username">
      </label>

      <label class="field">
        <span>Senha</span>
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </label>

      <p id="loginError" class="form-error" hidden></p>

      <button type="submit" class="btn btn-gold btn-lg admin-full-btn">Entrar</button>
    </form>
  </section>

  <!-- ══════════════════════════════
       DASHBOARD
  ══════════════════════════════ -->
  <section id="dashboard" class="dashboard" hidden>
    <header class="admin-header">
      <img src="image/logo.png" alt="Rei das Chaves" class="admin-header-logo">
      <div class="admin-header-title">
        <h1>Painel Admin</h1>
        <span id="adminUserEmail" class="admin-user-email"></span>
      </div>
      <div class="admin-header-actions">
        <a href="fechaduras-eletronicas" target="_blank" class="btn btn-call">Ver Catálogo</a>
        <button type="button" id="logoutBtn" class="btn btn-call">Sair</button>
      </div>
    </header>

    <main class="admin-main">
      <div class="admin-toolbar">
        <h2>Produtos</h2>
        <button type="button" id="newProductBtn" class="btn btn-gold">+ Novo Produto</button>
      </div>

      <div id="adminStatus" class="catalog-status"></div>

      <div class="admin-table-wrap">
        <table class="admin-table" id="productsTable" hidden>
          <thead>
            <tr>
              <th></th>
              <th>Nome</th>
              <th>Categoria</th>
              <th>Preço</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="productsTableBody"></tbody>
        </table>
      </div>
    </main>
  </section>

  <!-- ══════════════════════════════
       MODAL DE PRODUTO (CRIAR/EDITAR)
  ══════════════════════════════ -->
  <div class="drawer-overlay" id="productModalOverlay"></div>
  <div class="product-modal" id="productModal">
    <form id="productForm" class="product-modal-card">
      <div class="product-modal-header">
        <h2 id="productModalTitle">Novo Produto</h2>
        <button type="button" class="drawer-close" id="productModalClose" aria-label="Fechar">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" width="20" height="20" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <input type="hidden" id="productId">

      <label class="field">
        <span>Nome do produto *</span>
        <input type="text" id="productName" required placeholder="Ex: Fechadura Digital XPTO Bio">
      </label>

      <label class="field">
        <span>Categoria *</span>
        <input type="text" id="productCategory" required placeholder="Ex: Fechaduras Eletrônicas" value="Fechaduras Eletrônicas">
      </label>

      <label class="field">
        <span>Preço (opcional)</span>
        <input type="number" id="productPrice" min="0" step="0.01" placeholder="Deixe em branco pra \"Consulte no WhatsApp\"">
      </label>

      <label class="field">
        <span>Descrição curta (aparece no card do catálogo) *</span>
        <input type="text" id="productShortDesc" required maxlength="120" placeholder="Ex: Biometria, senha e cartão de aproximação">
      </label>

      <label class="field">
        <span>Descrição completa (aparece na página do produto) *</span>
        <textarea id="productDescription" required rows="5" placeholder="Detalhes, especificações, o que acompanha..."></textarea>
      </label>

      <label class="field">
        <span>Arquivo da foto (peça pro Claude salvar em image/products/ e cole o caminho aqui) *</span>
        <input type="text" id="productImagePath" required placeholder="Ex: image/products/fechadura-xpto.jpg">
        <img id="productImagePreview" class="product-image-preview" hidden alt="Pré-visualização">
      </label>

      <label class="field">
        <span>Link do vídeo no YouTube (opcional)</span>
        <input type="text" id="productVideo" placeholder="Ex: https://www.youtube.com/watch?v=xxxxxxxx">
      </label>

      <label class="field-checkbox">
        <input type="checkbox" id="productActive" checked>
        <span>Produto ativo (visível no catálogo)</span>
      </label>

      <p id="productFormError" class="form-error" hidden></p>

      <div class="product-modal-actions">
        <button type="button" id="deleteProductBtn" class="btn admin-danger-btn" hidden>Excluir</button>
        <button type="submit" class="btn btn-gold" id="productSubmitBtn">Salvar Produto</button>
      </div>
    </form>
  </div>

  <script type="module" src="js/admin.js?v=2"></script>
</body>
</html>
